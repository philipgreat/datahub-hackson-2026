<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DataHub × TeaQL 演示导演台</title>
    <meta
      name="description"
      content="DataHub MCP 到 TeaQL 代码生成与审计脱敏的三分钟演示导演台"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="回到演示第一步">
        <span class="brand-mark">D×T</span>
        <span>
          <strong>DataHub × TeaQL</strong>
          <small>DEMO DIRECTOR</small>
        </span>
      </a>

      <div class="run-status" aria-label="演示状态">
        <span class="status-dot"></span>
        <span id="runStatus">READY</span>
        <span class="divider"></span>
        <span id="elapsed">00:00</span>
        <span class="muted">/ 03:00</span>
      </div>

      <div class="top-actions">
        <button class="ghost-button" id="resetButton" type="button">重置</button>
        <button class="ghost-button" id="captionButton" type="button">字幕模式</button>
        <button class="primary-button compact" id="startButton" type="button">开始演示</button>
      </div>
    </header>

    <main class="shell">
      <aside class="runbook" aria-label="演示步骤">
        <div class="section-label">RUN OF SHOW</div>
        <nav id="stepNav"></nav>

        <div class="guardrail">
          <span class="guardrail-icon">!</span>
          <div>
            <strong>演示边界</strong>
            <p>不要展示 Token、Cookie、SSH 信息或未经脱敏的个人数据。</p>
          </div>
        </div>
      </aside>

      <section class="stage" aria-live="polite">
        <div class="eyebrow-row">
          <span id="chapter">OPENING</span>
          <span class="time-chip" id="timeChip">建议 20 秒</span>
        </div>

        <div class="caption-card">
          <div class="step-counter" id="stepCounter">01 / 07</div>
          <h1 id="title">把治理上下文带进代码生成</h1>
          <p class="subtitle" id="subtitle">
            Coding Agent 通过 MCP 读取 DataHub，再在内网生成可验证的 TeaQL 应用。
          </p>
          <div class="talk-track">
            <span>你可以这样说</span>
            <blockquote id="talkTrack"></blockquote>
          </div>
        </div>

        <div class="stage-footer">
          <button class="nav-button" id="previousButton" type="button" aria-label="上一步">
            <span>←</span> 上一步
          </button>
          <div class="keyboard-hint">
            <kbd>Space</kbd>
            <span>或</span>
            <kbd>→</kbd>
            <span>进入下一步</span>
          </div>
          <button class="primary-button" id="nextButton" type="button">
            下一步 <span>→</span>
          </button>
        </div>
      </section>

      <aside class="cue-panel" aria-label="当前操作提示">
        <div class="section-label">NEXT ACTION</div>

        <div class="cue-card primary-cue">
          <span class="cue-number">现在</span>
          <h2 id="actionTitle"></h2>
          <p id="actionDetail"></p>
        </div>

        <div class="section-label secondary-label">OPEN THESE</div>
        <div class="resource-list" id="resourceList"></div>

        <div class="focus-box">
          <span>画面重点</span>
          <p id="focusText"></p>
        </div>

        <div class="avoid-box">
          <span>避免这样说</span>
          <p id="avoidText"></p>
        </div>
      </aside>
    </main>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="app.js"></script>
  </body>
</html>
